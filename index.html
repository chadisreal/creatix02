<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--app-head-->
    <meta name="theme-color" content="#0b0b0b" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <!-- Only the two faces needed for first paint. latin-ext is a rare-glyph fallback and
         Cormorant is decoration, so preloading them would serialise bandwidth against the LCP. -->
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>try{if(localStorage.getItem('creatix-theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
